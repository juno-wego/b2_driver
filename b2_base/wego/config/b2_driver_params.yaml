b2_cmd_vel_bridge:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    request_topic: /api/sport/request
    max_linear_x: 1.0
    max_reverse_linear_x: 0.8
    max_linear_y: 0.4
    max_angular_z: 1.2
    deadband: 0.01
    command_rate_hz: 20.0
    cmd_timeout: 0.5
    stop_on_timeout: true
    auto_balance_stand_on_start: false

b2_state_bridge:
  ros__parameters:
    sport_state_topic: /sportmodestate
    low_state_topic: /lowstate
    odom_topic: /b2/odom
    imu_topic: /b2/imu/data
    joint_state_topic: /b2/joint_states
    foot_force_topic: /b2/foot_force
    odom_frame: odom
    base_frame: base_link
    imu_frame: imu_link
    publish_tf: true

# Direct Unitree SDK2 hardware driver.  This is deliberately separate from
# the ROS/DDS bridge above: MuJoCo continues to own /cmd_vel through its
# policy runner, while hardware can use the vendor SDK without an extra ROS
# request topic in between.
b2_sdk_driver:
  ros__parameters:
    # Original SportModeState.stamp on the controller time axis. Invalid,
    # repeated or wrong-epoch samples never fall back to receipt time.
    source_time.mode: source
    source_time.offset_ns: 0
    source_time.max_age_s: 0.5
    source_time.future_tolerance_s: 0.05
    enable_control: true
    network_interface: ""
    dds_domain: 0
    cmd_vel_topic: /cmd_vel
    odom_topic: /b2/odom
    imu_topic: /b2/imu/data
    joint_state_topic: /b2/joint_states
    battery_topic: /b2/battery_state
    foot_force_topic: /b2/foot_force
    mode_topic: /b2/mode_code
    comm_ok_topic: /b2/comm_ok
    # Keep the established Nav2/SLAM TF tree by default.  Multi-robot users
    # can set these to b2/odom, b2/base_link, and b2/imu_link together.
    odom_frame: odom
    base_frame: base_link
    imu_frame: imu_link
    publish_tf: true
    max_linear_x: 1.0
    max_reverse_linear_x: 0.8
    max_linear_y: 0.4
    max_angular_z: 1.2
    deadband: 0.01
    command_rate_hz: 20.0
    cmd_timeout: 0.5
    stop_on_timeout: true
    auto_balance_stand_on_start: false
    state_timeout: 0.5
    # Read-only SDK checks. These never select/release/switch controllers.
    controller.require_ready: true
    controller.expected_form: "0"
    controller.allowed_names: [normal, ai, advanced]
    controller.poll_period_s: 1.0
    controller.rpc_timeout_s: 0.15
    controller.max_age_s: 2.5
    configuration.stop_confirm_timeout_s: 2.0
    configuration.stationary_linear_mps: 0.03
    configuration.stationary_angular_radps: 0.05
    # BodyHeight's reference and limits must be verified on this B2 firmware.
    # These zero placeholders are NOT a physical height range.
    body_height.enabled: false
    body_height.minimum: 0.0
    body_height.maximum: 0.0
    # Body Euler angles are radians; configure permitted limits before enabling.
    body_pose.enabled: false
    body_pose.max_roll_rad: 0.0
    body_pose.max_pitch_rad: 0.0
    body_pose.max_yaw_rad: 0.0
    gait_configuration.enabled: false
    # Raw FreeHeight/GaitHeight switches; verify behavior on installed firmware.
    height_mode_configuration.enabled: false
    # gait_configuration.allowed_ids: [firmware-verified integer IDs]
